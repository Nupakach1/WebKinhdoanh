<html>
    <head>
        <title>Travel Expense Report</title>
    </head>
    <body style="background-color: #ccffff;">
        <div align="center">
            <img src="DeLong.jpg" />
        </div>
        <h2>Travel Expense Report</h2>
        <hr/>
        <form>
            <table>
                <tr>
                    <td>1) First Name: </td>
                    <td><input type="text" name="firstname" id="firstname"></td>
                    <td>Last Name: </td>
                    <td><input type="text" name="lastname" id="lastname"></td>
                </tr>
            </table>
            <table>
                <tr>
                    <td>2) Social Security Number: </td>
                    <td><input type="text" name="Number" id="Number" size="10"></td>
                </tr>
            </table>
            <table>
                <tr>
                    <td>3) Department:</td>
                    <td>
                        <select name="Department" id="Department">
                            <option value="Accounting">Accounting</option>
                            <option value="hr">Human Resources</option>
                            <option value="IT">Information Technology</option>
                        </select>
                    </td>
                </tr>
            </table>
            <table>
                <tr>
                    <td>4) Describe the purpose of your trip</td>
                </tr>
                <tr>
                    <td><textarea name="purpose" id="purpose" rows="5" cols="70"></textarea></td>
                </tr>
            </table>
            <table>
                <tr>
                    <td>5) Itemize your travel expenses</td>
                </tr>
            </table>
            <table border="1">
                <tr style="font-weight: bold ; text-align: center;">
                    <td>Date</td>
                    <td>Description</td>
                    <td>Category</td>
                    <td>Amount</td>
                </tr>
                <tr align="center">
                    <td width="100"><input type="date" name="date" id="date1"></td>
                    <td width="300"><input type="text" name="Description" id="Description1" size="30"></td>
                    <td width="150">
                        <select name="Category" id="Category1">
                            <option value="Meal">Meal</option>
                            <option value="Vegetables">Vegetables</option>
                            <option value="Drink">Drink</option>
                        </select>
                    </td>
                    <td width="100"><input type="text" name="Amount" id="Amount1"></td>
                </tr>
                <tr align="center">
                    <td width="100"><input type="date" name="date" id="date2"></td>
                    <td width="300"><input type="text" name="Description" id="Description2" size="30"></td>
                    <td width="150">
                        <select name="Category" id="Category2">
                            <option value="Meal">Meal</option>
                            <option value="Vegetables">Vegetables</option>
                            <option value="Drink">Drink</option>
                        </select>
                    </td>
                    <td width="100"><input type="text" name="Amount" id="Amount2"></td>
                </tr>
                <tr align="center">
                    <td width="100"><input type="date" name="date" id="date3"></td>
                    <td width="300"><input type="text" name="Description" id="Description3" size="30"></td>
                    <td width="150">
                        <select name="Category" id="Category3">
                            <option value="Meal">Meal</option>
                            <option value="Vegetables">Vegetables</option>
                            <option value="Drink">Drink</option>
                        </select>
                    </td>
                    <td width="100"><input type="text" name="Amount" id="Amount3"></td>
                </tr>
                <tr align="center">
                    <td width="100"><input type="date" name="date" id="date4"></td>
                    <td width="300"><input type="text" name="Description" id="Description4" size="30"></td>
                    <td width="150">
                        <select name="Category" id="Category4">
                            <option value="Meal">Meal</option>
                            <option value="Vegetables">Vegetables</option>
                            <option value="Drink">Drink</option>
                        </select>
                    </td>
                    <td width="100"><input type="text" name="Amount" id="Amount4"></td>
                </tr>
            </table>
            <table>
                <tr>
                    <td>
                        6) Have you submitted your receipts?
                    </td>
                    <td><input type="radio" name="submit" id="Yes" value="Yes"><label for="Yes">Yes</label></td>
                    <td><input type="radio" name="submit" id="No" value="No"><label for="No">No</label></td>
                </tr>
                <tr>
                    <td>
                        <input type="submit" value="Submit travel expenses">
                        <input type="reset" value="Reset">
                    </td>
                </tr>
            </table>
            <p>
                Question? Contact Debbie Larson in Accounting (ext. 2150)
            </p>
        </form>
    </body>
</html>
